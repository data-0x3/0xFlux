# Runs 0xFLUX against a lab network of containers we own and commits one
# screenshot per page to docs/screenshots/. Actions -> "Screenshots" -> Run.
name: Screenshots

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: System tools
        run: sudo apt-get update -q && sudo apt-get install -y -q nmap

      - name: Lab network (containers owned by this job)
        run: |
          docker network create --subnet 172.30.0.0/28 fluxlab
          docker run -d --name web      --net fluxlab --ip 172.30.0.2 nginx:alpine
          docker run -d --name cache    --net fluxlab --ip 172.30.0.3 redis:7-alpine
          docker run -d --name intranet --net fluxlab --ip 172.30.0.4 httpd:alpine
          docker pull -q python:3.12-alpine
          docker pull -q curlimages/curl
          echo "BRIDGE=br-$(docker network inspect -f '{{.Id}}' fluxlab | cut -c1-12)" >> "$GITHUB_ENV"

      - name: Start the 0xFLUX engine (root, for capture and OS detection)
        run: |
          python -m pip install -q -r backend/requirements.txt playwright==1.48.0
          python -m playwright install --with-deps chromium
          cd backend && sudo -E "$(which python)" flux_engine.py > ../engine.log 2>&1 &
          for i in $(seq 1 40); do curl -sf http://127.0.0.1:8787/api/health && break; sleep 1; done

      - name: Start the interface
        run: |
          npm install --prefix frontend --no-audit --no-fund
          nohup npm --prefix frontend run dev > vite.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:1420 >/dev/null && break; sleep 1; done

      - name: Capture screenshots
        run: python tools/screenshots.py 172.30.0.0/28 "$BRIDGE"

      - name: Logs
        if: always()
        run: |
          echo "---- engine ----"; sudo tail -n 60 engine.log || true
          echo "---- vite ----"; tail -n 30 vite.log || true

      - name: Commit screenshots
        run: |
          git config user.name "0x3"
          git config user.email "data-0x3@users.noreply.github.com"
          git add docs/screenshots
          git commit -m "docs: app screenshots [skip ci]" || exit 0
          git push
